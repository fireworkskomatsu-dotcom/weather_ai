<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Market AI Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{
      margin:0;
      background:#081225;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .wrap{
      max-width:960px;
      margin:0 auto;
      padding:20px;
    }
    .card{
      background:#0d1830;
      border-radius:20px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 4px 20px rgba(0,0,0,.25);
    }
    .hero{
      background:#f0cb00;
      color:#111;
      text-align:center;
    }
    h1,h2,h3{margin:0 0 12px 0}
    .status{font-size:2rem;font-weight:700;margin:8px 0}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px;
    }
    .metric{
      font-size:1.2rem;
      line-height:1.8;
    }
    .small{
      opacity:.9;
      font-size:.95rem;
    }
    #chartBox{
      height:320px;
    }
    .alloc{
      font-size:1.15rem;
      line-height:1.9;
    }
    .good{color:#4ade80}
    .bad{color:#f87171}
    .mid{color:#facc15}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card hero">
      <h1>JP Market AI Dashboard</h1>
      <div id="status" class="status">LOADING</div>
      <div id="action" class="metric">読み込み中...</div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>市場判定</h2>
        <div id="marketBlock" class="metric">読み込み中...</div>
      </div>

      <div class="card">
        <h2>寄り付きAI</h2>
        <div id="openBlock" class="metric">読み込み中...</div>
      </div>

      <div class="card">
        <h2>信頼度</h2>
        <div id="confidenceBlock" class="metric">読み込み中...</div>
      </div>
    </div>

    <div class="card">
      <h2>ポジション配分</h2>
      <div id="positionBlock" class="alloc">読み込み中...</div>
    </div>

    <div class="card">
      <h2>スコア推移</h2>
      <div id="chartBox">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard(){
      const res = await fetch("dashboard.json?v=" + Date.now());
      const data = await res.json();

      const weather = data.weather || "-";
      const score = data.score || "-";
      const danger = data.danger || "-";
      const temp = data.market_temp || "-";
      const action = data.action || "-";
      const up = data.up_prob || "-";
      const down = data.down_prob || "-";

      const pos = data.position || {};
      const alloc = pos.allocations || {};

      const open = data.open || {};
      const conf = data.confidence || {};

      document.getElementById("status").textContent =
        weather === "青" ? "RISK ON" : (weather === "赤" ? "RISK OFF" : "NEUTRAL");

      document.getElementById("action").textContent =
        `売買判断: ${action}`;

      document.getElementById("marketBlock").innerHTML = `
        スコア: <b>${score}</b><br>
        危険度: <b>${danger}</b><br>
        市場温度: <b>${temp}</b><br>
        上昇確率: <b>${up}</b><br>
        下落確率: <b>${down}</b>
      `;

      document.getElementById("openBlock").innerHTML = `
        寄り上昇: <b>${open.open_up_prob ?? "-"}</b>%<br>
        寄り下落: <b>${open.open_down_prob ?? "-"}</b>%<br>
        バイアス: <b>${open.gap_bias ?? "-"}</b>
      `;

      document.getElementById("confidenceBlock").innerHTML = `
        信頼度: <b>${conf.confidence ?? "-"}</b><br>
        レベル: <b>${conf.level ?? "-"}</b>
      `;

      document.getElementById("positionBlock").innerHTML = `
        日経ETF: <b>${alloc.nikkei_etf ?? "-"}</b><br>
        半導体ETF: <b>${alloc.semi_etf ?? "-"}</b><br>
        現金: <b>${alloc.cash ?? "-"}</b><br>
        総ポジション: <b>${pos.total_position ?? "-"}</b>
      `;
    }

    async function drawChart(){
      const res = await fetch("chart_history.csv?v=" + Date.now());
      const text = await res.text();
      const rows = text.trim().split("\n").slice(1);

      const labels = [];
      const data = [];

      rows.forEach(row => {
        const [d, s] = row.split(",");
        if (d && s !== undefined) {
          labels.push(d);
          data.push(Number(s));
        }
      });

      new Chart(document.getElementById("scoreChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "AI Score",
            data,
            borderColor: "#00e0b8",
            backgroundColor: "rgba(0,224,184,0.15)",
            tension: 0.25,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: "#fff" } }
          },
          scales: {
            x: {
              ticks: { color: "#d6dbe5", maxRotation: 45, minRotation: 45 },
              grid: { color: "rgba(255,255,255,0.08)" }
            },
            y: {
              ticks: { color: "#d6dbe5" },
              grid: { color: "rgba(255,255,255,0.08)" }
            }
          }
        }
      });
    }

    loadDashboard();
    drawChart();
  </script>
</body>
</html>
