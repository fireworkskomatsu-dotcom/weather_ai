<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Market Weather</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#0b1220; color:#fff; font-family:sans-serif; margin:0; padding:20px; }
    .card { background:#111a2e; border-radius:16px; padding:16px; margin-bottom:16px; }
    h1,h2 { margin:0 0 12px 0; }
    #weather { white-space:pre-wrap; line-height:1.7; }
    #chartBox { height:320px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JP Market Weather</h1>
    <div id="weather">読み込み中...</div>
  </div>

  <div class="card">
    <h2>スコア推移</h2>
    <div id="chartBox">
      <canvas id="scoreChart"></canvas>
    </div>
  </div>

  <script>
    fetch("weather.txt?v=" + Date.now())
      .then(r => r.text())
      .then(t => {
        document.getElementById("weather").textContent = t;
      });

    fetch("history.csv?v=" + Date.now())
      .then(r => r.text())
      .then(t => {
        const rows = t.trim().split("\n").slice(1);
        const labels = [];
        const data = [];

        rows.forEach(row => {
          const [d, s] = row.split(",");
          if (d && s !== undefined) {
            labels.push(d);
            data.push(Number(s));
          }
        });

        const ctx = document.getElementById("scoreChart");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: "AI Score",
              data: data,
              borderColor: "#00e0b8",
              backgroundColor: "rgba(0,224,184,0.15)",
              tension: 0.25,
              pointRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false
          }
        });
      });
  </script>
</body>
</html>
