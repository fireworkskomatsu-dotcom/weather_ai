<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Market AI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
    margin:0;
    background:#08142b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
    max-width:980px;
    margin:0 auto;
    padding:18px;
}
.card{
    background:#0d1b3d;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.header{
    background:#f5c400;
    color:#111;
    text-align:center;
}
.header h1{
    margin:0 0 10px 0;
    font-size:28px;
}
.status{
    font-size:34px;
    font-weight:800;
    margin:8px 0 10px 0;
}
.order{
    margin-top:14px;
    padding:16px;
    border-radius:16px;
    background:#111;
    color:#fff;
    text-align:left;
}
.order-line{
    display:block;
    white-space:nowrap;
    font-size:18px;
    font-weight:800;
    line-height:1.8;
    margin-bottom:6px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}
h2{
    margin:0 0 12px 0;
}
.metric{
    font-size:20px;
    line-height:1.8;
}
.small{
    font-size:14px;
    opacity:0.85;
}
.buy{ color:#4ade80; }
.sell{ color:#f87171; }
.wait{ color:#facc15; }
.pnl-plus{ color:#4ade80; font-weight:800; }
.pnl-minus{ color:#f87171; font-weight:800; }
.pnl-flat{ color:#facc15; font-weight:800; }
.exec{ color:#4ade80; font-weight:900; }
.light{ color:#facc15; font-weight:900; }
.skip{ color:#f87171; font-weight:900; }
.event-high{ color:#f87171; font-weight:900; }
.event-mid{ color:#facc15; font-weight:900; }
.event-low{ color:#4ade80; font-weight:900; }
.streak-stop{ color:#f87171; font-weight:900; }
.streak-reduce{ color:#facc15; font-weight:900; }
.streak-normal{ color:#4ade80; font-weight:900; }
.news-line{
    font-size:15px;
    line-height:1.6;
    margin-bottom:8px;
}

.chartWrap{
    height:340px;
}
#chart{
    width:100%;
    height:100%;
    background:#0b1733;
    border-radius:12px;
}
</style>
</head>
<body>
<div class="wrap">

    <div class="card header">
        <h1>JP Market AI Dashboard</h1>
        <div id="status" class="status">LOADING...</div>
        <div id="action" class="metric">読み込み中...</div>
        <div id="orderBlock" class="order">注文計算中...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>市場判定</h2>
            <div id="marketBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>寄り付きAI</h2>
            <div id="openBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>信頼度</h2>
            <div id="confidenceBlock" class="metric">読み込み中...</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>フィルター</h2>
            <div id="filterBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>イベント</h2>
            <div id="eventBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>連敗ガード</h2>
            <div id="streakBlock" class="metric">読み込み中...</div>
        </div>
    </div>

    <div class="card">
        <h2>ニュース</h2>
        <div id="newsBlock" class="metric">読み込み中...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>ポジション配分</h2>
            <div id="positionBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>前回損益</h2>
            <div id="pnlBlock" class="metric">計算待ち...</div>
        </div>

        <div class="card">
            <h2>成績</h2>
            <div id="statsBlock" class="metric">集計待ち...</div>
        </div>
    </div>

    <div class="card">
        <h2>スコア推移</h2>
        <div class="chartWrap">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <div class="card small" id="updated">更新時刻読み込み中...</div>

</div>

<script>
async function loadDashboard() {
    const res = await fetch("dashboard.json?v=" + Date.now());
    const data = await res.json();

    const weather = data.weather || "-";
    const action = data.action || "-";
    const score = data.score || "-";
    const danger = data.danger || "-";
    const temp = data.market_temp || "-";
    const up = data.up_prob || "-";
    const down = data.down_prob || "-";
    const updated = data.updated_at || "-";
    const capital = Number(data.capital || 0);

    const pos = data.position || {};
    const alloc = pos.allocations || {};
    const open = data.open || {};
    const conf = data.confidence || {};
    const pnlStats = data.pnl_stats || {};
    const filt = data.filter || {};
    const eventData = data.event || {};
    const newsData = data.news || {};
    const streakData = data.streak || {};

    let statusText = "NEUTRAL";
    if (weather === "青") statusText = "RISK ON";
    if (weather === "赤") statusText = "RISK OFF";

    document.getElementById("status").textContent = statusText;
    document.getElementById("action").textContent = "売買判断: " + action;

    document.getElementById("marketBlock").innerHTML =
        "スコア: <b>" + score + "</b><br>" +
        "危険度: <b>" + danger + "</b><br>" +
        "市場温度: <b>" + temp + "</b><br>" +
        "上昇確率: <b>" + up + "</b><br>" +
        "下落確率: <b>" + down + "</b>";

    document.getElementById("openBlock").innerHTML =
        "寄り上昇: <b>" + (open.open_up_prob ?? "-") + "%</b><br>" +
        "寄り下落: <b>" + (open.open_down_prob ?? "-") + "%</b><br>" +
        "バイアス: <b>" + (open.gap_bias ?? "-") + "</b>";

    document.getElementById("confidenceBlock").innerHTML =
        "信頼度: <b>" + (conf.confidence ?? "-") + "</b><br>" +
        "レベル: <b>" + (conf.level ?? "-") + "</b>";

    const decision = filt.decision || "-";
    const size = filt.size ?? "-";
    const filterReason = filt.reason || "";

    let decisionHtml = '<span>' + decision + '</span>';
    if (decision === "EXECUTE") decisionHtml = '<span class="exec">EXECUTE</span>';
    if (decision === "LIGHT") decisionHtml = '<span class="light">LIGHT</span>';
    if (decision === "SKIP") decisionHtml = '<span class="skip">SKIP</span>';

    document.getElementById("filterBlock").innerHTML =
        "判定: " + decisionHtml + "<br>" +
        "サイズ倍率: <b>" + size + "</b><br>" +
        "理由: <b>" + filterReason + "</b>";

    const eventLevel = eventData.event_level || "LOW";
    const eventReason = eventData.event_reason || "通常日";
    let eventHtml = '<span class="event-low">LOW</span>';
    if (eventLevel === "MID") eventHtml = '<span class="event-mid">MID</span>';
    if (eventLevel === "HIGH") eventHtml = '<span class="event-high">HIGH</span>';

    document.getElementById("eventBlock").innerHTML =
        "イベント強度: " + eventHtml + "<br>" +
        "内容: <b>" + eventReason + "</b>";

    const streakDecision = streakData.decision || "NORMAL";
    const streakReason = streakData.reason || "通常運転";
    const consecutiveLosses = streakData.consecutive_losses ?? 0;

    let streakHtml = '<span class="streak-normal">NORMAL</span>';
    if (streakDecision === "REDUCE") streakHtml = '<span class="streak-reduce">REDUCE</span>';
    if (streakDecision === "STOP") streakHtml = '<span class="streak-stop">STOP</span>';

    document.getElementById("streakBlock").innerHTML =
        "状態: " + streakHtml + "<br>" +
        "連敗数: <b>" + consecutiveLosses + "</b><br>" +
        "理由: <b>" + streakReason + "</b>";

    const newsLevel = newsData.news_level || "LOW";
    const newsReason = newsData.news_reason || "通常ニュースフロー";
    const newsScore = newsData.news_score ?? 0;
    const headlines = newsData.headlines || [];

    let newsHeader = "ニュース強度: <b>" + newsLevel + "</b><br>" +
                     "理由: <b>" + newsReason + "</b><br>" +
                     "ニューススコア: <b>" + newsScore + "</b><br><br>";

    let newsLines = "";
    headlines.slice(0, 5).forEach(h => {
        newsLines += '<div class="news-line">・' + h.title + '</div>';
    });
    if (newsLines === "") {
        newsLines = '<div class="news-line">ニュース取得なし</div>';
    }

    document.getElementById("newsBlock").innerHTML = newsHeader + newsLines;

    document.getElementById("positionBlock").innerHTML =
        "日経ETF: <b>" + (alloc.nikkei_etf ?? "-") + "</b><br>" +
        "半導体ETF: <b>" + (alloc.semi_etf ?? "-") + "</b><br>" +
        "現金: <b>" + (alloc.cash ?? "-") + "</b><br>" +
        "総ポジション: <b>" + (pos.total_position ?? "-") + "</b>";

    const nikkei = Number(alloc.nikkei_etf ?? 0);
    const semi = Number(alloc.semi_etf ?? 0);
    const sizeFactor = Number(filt.size ?? 0);

    let orderLines = [];

    if (decision === "SKIP" || sizeFactor === 0) {
        orderLines.push('<span class="order-line wait">何もしない</span>');
        orderLines.push('<span class="order-line">現金 → ' + capital.toLocaleString() + '円</span>');
    } else {
        if (nikkei < 0) {
            const amount = Math.round(capital * Math.abs(nikkei) * sizeFactor);
            orderLines.push('<span class="order-line sell">1357 買い → ' + amount.toLocaleString() + '円</span>');
        } else if (nikkei > 0) {
            const amount = Math.round(capital * Math.abs(nikkei) * sizeFactor);
            orderLines.push('<span class="order-line buy">1321 買い → ' + amount.toLocaleString() + '円</span>');
        }

        if (semi < 0) {
            const amount = Math.round(capital * Math.abs(semi) * sizeFactor);
            orderLines.push('<span class="order-line sell">2244 空売り → ' + amount.toLocaleString() + '円</span>');
        } else if (semi > 0) {
            const amount = Math.round(capital * Math.abs(semi) * sizeFactor);
            orderLines.push('<span class="order-line buy">2244 買い → ' + amount.toLocaleString() + '円</span>');
        }

        const usedCapital = Math.round(capital * ((Math.abs(nikkei) + Math.abs(semi)) * sizeFactor));
        const cashAmount = capital - usedCapital;
        orderLines.push('<span class="order-line">現金 → ' + cashAmount.toLocaleString() + '円</span>');
    }

    document.getElementById("orderBlock").innerHTML = orderLines.join("");

    let pnlHtml = "まだデータ不足";
    const lastPnlRaw = pnlStats.last_pnl ?? "";
    if (String(lastPnlRaw).trim() !== "") {
        const pnl = Number(lastPnlRaw);
        if (pnl > 0) {
            pnlHtml = '前回損益: <span class="pnl-plus">+' + pnl.toLocaleString() + '円</span>';
        } else if (pnl < 0) {
            pnlHtml = '前回損益: <span class="pnl-minus">' + pnl.toLocaleString() + '円</span>';
        } else {
            pnlHtml = '前回損益: <span class="pnl-flat">0円</span>';
        }
    }
    document.getElementById("pnlBlock").innerHTML = pnlHtml;

    let statsHtml = "まだデータ不足";
    const tradeCount = Number(pnlStats.trade_count ?? 0);
    if (tradeCount > 0) {
        const cumulative = Number(pnlStats.cumulative_pnl ?? 0);
        const winCount = Number(pnlStats.win_count ?? 0);
        const lossCount = Number(pnlStats.loss_count ?? 0);
        const winRate = pnlStats.win_rate ?? "";

        let cumulativeText = '<span class="pnl-flat">0円</span>';
        if (cumulative > 0) {
            cumulativeText = '<span class="pnl-plus">+' + cumulative.toLocaleString() + '円</span>';
        } else if (cumulative < 0) {
            cumulativeText = '<span class="pnl-minus">' + cumulative.toLocaleString() + '円</span>';
        }

        statsHtml =
            "累積損益: " + cumulativeText + "<br>" +
            "勝率: <b>" + winRate + "%</b><br>" +
            "勝ち: <b>" + winCount + "</b><br>" +
            "負け: <b>" + lossCount + "</b><br>" +
            "件数: <b>" + tradeCount + "</b>";
    }
    document.getElementById("statsBlock").innerHTML = statsHtml;

    document.getElementById("updated").textContent = "更新 " + updated;
}

async function drawChart() {
    const csv = await fetch("chart_history.csv?v=" + Date.now());
    const text = await csv.text();

    const lines = text.trim().split("\n").slice(1);
    const labels = [];
    const values = [];

    lines.forEach(line => {
        const parts = line.split(",");
        if (parts.length >= 2) {
            labels.push(parts[0]);
            values.push(parseFloat(parts[1]));
        }
    });

    new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "AI Score",
                data: values,
                borderColor: "#2563eb",
                backgroundColor: "rgba(37,99,235,0.15)",
                tension: 0.25,
                pointRadius: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: "#ffffff" }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: "#ffffff",
                        maxRotation: 45,
                        minRotation: 45
                    },
                    grid: { color: "rgba(255,255,255,0.12)" }
                },
                y: {
                    ticks: { color: "#ffffff" },
                    grid: { color: "rgba(255,255,255,0.12)" }
                }
            }
        }
    });
}

loadDashboard();
drawChart();
</script>

</body>
</html>
