<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Market AI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#08142b;
    color:white;
}

.card {
    margin:20px;
    padding:20px;
    border-radius:20px;
    background:#0d1b3d;
}

.header {
    background:#f5c400;
    color:black;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.small {
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="card header" id="header">
LOADING...
</div>

<div class="card" id="market"></div>
<div class="card" id="open"></div>
<div class="card" id="confidence"></div>
<div class="card" id="position"></div>

<div class="card">
<h2>スコア推移</h2>
<canvas id="chart"></canvas>
</div>

<div class="card small" id="updated"></div>

<script>
async function load() {
    const res = await fetch("dashboard.json?v=" + Date.now());
    const data = await res.json();

    document.getElementById("header").innerHTML =
        "JP Market AI Dashboard<br>" +
        data.weather + "<br>" +
        "売買判断: " + data.action;

    document.getElementById("market").innerHTML =
        "<h2>市場判定</h2>" +
        "スコア: " + data.score + "<br>" +
        "危険度: " + data.danger + "<br>" +
        "市場温度: " + data.market_temp + "<br>" +
        "上昇確率: " + data.up_prob + "<br>" +
        "下落確率: " + data.down_prob;

    document.getElementById("open").innerHTML =
        "<h2>寄り付きAI</h2>" +
        "寄り上昇: " + data.open.open_up_prob + "%<br>" +
        "寄り下落: " + data.open.open_down_prob + "%<br>" +
        "バイアス: " + data.open.gap_bias;

    document.getElementById("confidence").innerHTML =
        "<h2>信頼度</h2>" +
        "信頼度: " + data.confidence.confidence + "<br>" +
        "レベル: " + data.confidence.level;

    document.getElementById("position").innerHTML =
        "<h2>ポジション配分</h2>" +
        "日経ETF: " + data.position.allocations.nikkei_etf + "<br>" +
        "半導体ETF: " + data.position.allocations.semi_etf + "<br>" +
        "現金: " + data.position.allocations.cash + "<br>" +
        "総ポジション: " + data.position.total_position;

    document.getElementById("updated").innerText =
        "更新 " + data.updated_at;

    const csv = await fetch("chart_history.csv?v=" + Date.now());
    const text = await csv.text();

    const lines = text.split("\n").slice(1);
    const labels = [];
    const values = [];

    lines.forEach(l => {
        const parts = l.split(",");
        if(parts.length >= 2){
            labels.push(parts[0]);
            values.push(parseFloat(parts[1]));
        }
    });

    new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "AI Score",
                data: values
            }]
        }
    });
}

load();
</script>

</body>
</html>
