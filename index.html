<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Market AI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
    margin:0;
    background:#08142b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
    max-width:980px;
    margin:0 auto;
    padding:18px;
}
.card{
    background:#0d1b3d;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.header{
    background:#f5c400;
    color:#111;
    text-align:center;
}
.header h1{
    margin:0 0 10px 0;
    font-size:28px;
}
.status{
    font-size:34px;
    font-weight:800;
    margin:8px 0 10px 0;
}
.order{
    margin-top:14px;
    padding:16px;
    border-radius:16px;
    background:#111;
    color:#fff;
    text-align:left;
}
.order-line{
    display:block;
    white-space:nowrap;
    font-size:18px;
    font-weight:800;
    line-height:1.8;
    margin-bottom:6px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}
h2{
    margin:0 0 12px 0;
}
.metric{
    font-size:20px;
    line-height:1.8;
}
.small{
    font-size:14px;
    opacity:0.8;
}
.buy{ color:#4ade80; }
.sell{ color:#f87171; }
.wait{ color:#facc15; }

.chartWrap{
    height:340px;
}
#chart{
    width:100%;
    height:100%;
    background:#0b1733;
    border-radius:12px;
}
</style>
</head>
<body>
<div class="wrap">

    <div class="card header">
        <h1>JP Market AI Dashboard</h1>
        <div id="status" class="status">LOADING...</div>
        <div id="action" class="metric">読み込み中...</div>
        <div id="orderBlock" class="order">注文計算中...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>市場判定</h2>
            <div id="marketBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>寄り付きAI</h2>
            <div id="openBlock" class="metric">読み込み中...</div>
        </div>

        <div class="card">
            <h2>信頼度</h2>
            <div id="confidenceBlock" class="metric">読み込み中...</div>
        </div>
    </div>

    <div class="card">
        <h2>ポジション配分</h2>
        <div id="positionBlock" class="metric">読み込み中...</div>
    </div>

    <div class="card">
        <h2>スコア推移</h2>
        <div class="chartWrap">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <div class="card small" id="updated">更新時刻読み込み中...</div>

</div>

<script>
async function loadDashboard() {
    const res = await fetch("dashboard.json?v=" + Date.now());
    const data = await res.json();

    const weather = data.weather || "-";
    const action = data.action || "-";
    const score = data.score || "-";
    const danger = data.danger || "-";
    const temp = data.market_temp || "-";
    const up = data.up_prob || "-";
    const down = data.down_prob || "-";
    const updated = data.updated_at || "-";
    const capital = Number(data.capital || 0);

    const pos = data.position || {};
    const alloc = pos.allocations || {};
    const open = data.open || {};
    const conf = data.confidence || {};

    let statusText = "NEUTRAL";
    if (weather === "青") statusText = "RISK ON";
    if (weather === "赤") statusText = "RISK OFF";

    document.getElementById("status").textContent = statusText;
    document.getElementById("action").textContent = "売買判断: " + action;

    document.getElementById("marketBlock").innerHTML =
        "スコア: <b>" + score + "</b><br>" +
        "危険度: <b>" + danger + "</b><br>" +
        "市場温度: <b>" + temp + "</b><br>" +
        "上昇確率: <b>" + up + "</b><br>" +
        "下落確率: <b>" + down + "</b>";

    document.getElementById("openBlock").innerHTML =
        "寄り上昇: <b>" + (open.open_up_prob ?? "-") + "%</b><br>" +
        "寄り下落: <b>" + (open.open_down_prob ?? "-") + "%</b><br>" +
        "バイアス: <b>" + (open.gap_bias ?? "-") + "</b>";

    document.getElementById("confidenceBlock").innerHTML =
        "信頼度: <b>" + (conf.confidence ?? "-") + "</b><br>" +
        "レベル: <b>" + (conf.level ?? "-") + "</b>";

    document.getElementById("positionBlock").innerHTML =
        "日経ETF: <b>" + (alloc.nikkei_etf ?? "-") + "</b><br>" +
        "半導体ETF: <b>" + (alloc.semi_etf ?? "-") + "</b><br>" +
        "現金: <b>" + (alloc.cash ?? "-") + "</b><br>" +
        "総ポジション: <b>" + (pos.total_position ?? "-") + "</b>";

    const nikkei = Number(alloc.nikkei_etf ?? 0);
    const semi = Number(alloc.semi_etf ?? 0);
    const cash = Number(alloc.cash ?? 0);

    let orderLines = [];

    if (nikkei < 0) {
        const amount = Math.round(capital * Math.abs(nikkei));
        orderLines.push('<span class="order-line sell">1357 買い → ' + amount.toLocaleString() + '円</span>');
    } else if (nikkei > 0) {
        const amount = Math.round(capital * Math.abs(nikkei));
        orderLines.push('<span class="order-line buy">1321 買い → ' + amount.toLocaleString() + '円</span>');
    }

    if (semi < 0) {
        const amount = Math.round(capital * Math.abs(semi));
        orderLines.push('<span class="order-line sell">2244 空売り → ' + amount.toLocaleString() + '円</span>');
    } else if (semi > 0) {
        const amount = Math.round(capital * Math.abs(semi));
        orderLines.push('<span class="order-line buy">2244 買い → ' + amount.toLocaleString() + '円</span>');
    }

    if (orderLines.length === 0) {
        orderLines.push('<span class="order-line wait">何もしない</span>');
    }

    orderLines.push('<span class="order-line">現金 → ' + Math.round(capital * cash).toLocaleString() + '円</span>');

    document.getElementById("orderBlock").innerHTML = orderLines.join("");
    document.getElementById("updated").textContent = "更新 " + updated;
}

async function drawChart() {
    const csv = await fetch("chart_history.csv?v=" + Date.now());
    const text = await csv.text();

    const lines = text.trim().split("\n").slice(1);
    const labels = [];
    const values = [];

    lines.forEach(line => {
        const parts = line.split(",");
        if (parts.length >= 2) {
            labels.push(parts[0]);
            values.push(parseFloat(parts[1]));
        }
    });

    new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "AI Score",
                data: values,
                borderColor: "#2563eb",
                backgroundColor: "rgba(37,99,235,0.15)",
                tension: 0.25,
                pointRadius: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: "#ffffff" }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: "#ffffff",
                        maxRotation: 45,
                        minRotation: 45
                    },
                    grid: { color: "rgba(255,255,255,0.12)" }
                },
                y: {
                    ticks: { color: "#ffffff" },
                    grid: { color: "rgba(255,255,255,0.12)" }
                }
            }
        }
    });
}

loadDashboard();
drawChart();
</script>

</body>
</html>
