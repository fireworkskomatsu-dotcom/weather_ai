<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JP Market Weather</title>

<style>

body{
background:#0f1116;
color:white;
font-family:-apple-system,BlinkMacSystemFont;
margin:0;
padding:20px;
}

h1{
font-size:28px;
margin-bottom:10px;
}

.weather{
font-size:36px;
margin-bottom:10px;
}

.score{
font-size:18px;
margin-bottom:20px;
}

.comment{
background:#1b1f2a;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:#1b1f2a;
padding:15px;
border-radius:10px;
}

.market-name{
font-size:14px;
opacity:.7;
}

.market-price{
font-size:22px;
margin-top:4px;
}

.market-change{
font-size:14px;
margin-top:4px;
}

.up{color:#4cd964}
.down{color:#ff3b30}

</style>
</head>

<body>

<h1>JP Market Weather</h1>

<div id="weather"></div>

<div class="cards" id="cards"></div>

<script>

async function load(){

let txt=await fetch("latest_weather.txt?"+Date.now()).then(r=>r.text())

let weather=txt.match(/天気：JP=(.)/)
let score=txt.match(/スコア：([-\d]+)/)
let risk=txt.match(/危険度：(\w+)/)

let html=""

if(weather) html+=`<div class="weather">天気 ${weather[1]}</div>`
if(score) html+=`<div class="score">Score ${score[1]}</div>`
if(risk) html+=`<div class="score">Risk ${risk[1]}</div>`

document.getElementById("weather").innerHTML=html

let cards=await fetch("cards.json?"+Date.now()).then(r=>r.json())

let out=""

cards.forEach(c=>{

let cls=""

if(typeof c.change==="number"){
if(c.change>0) cls="up"
if(c.change<0) cls="down"
}

out+=`
<div class="card">
<div class="market-name">${c.name}</div>
<div class="market-price">${c.price}</div>
<div class="market-change ${cls}">${c.change}%</div>
</div>
`

})

document.getElementById("cards").innerHTML=out

}

load()

</script>

</body>
</html>
