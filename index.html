<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JP Market Weather</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
  margin-top:80px;
}

.box{
  font-size:28px;
  padding:20px;
  border-radius:10px;
  display:inline-block;
  white-space:pre-wrap;
}

.red { background:#c0392b; }
.blue { background:#2980b9; }
.yellow { background:#f1c40f; color:black; }

</style>
</head>

<body>

<h1>JP Market Weather</h1>

<div id="weather" class="box yellow">Loading...</div>

<script>

fetch("weather.txt?" + Date.now())
.then(r=>r.text())
.then(t=>{

const el=document.getElementById("weather")

if(t.includes("JP=赤")) el.className="box red"
else if(t.includes("JP=青")) el.className="box blue"
else el.className="box yellow"

el.innerText=t

})

</script>

</body>
</html>
