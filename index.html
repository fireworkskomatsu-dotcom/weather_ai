<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JP Market Weather</title>

<style>
body{
background:#0f1116;
color:white;
font-family:-apple-system;
margin:0;
padding:20px;
}

.weather{
font-size:32px;
margin-bottom:10px;
}

.score{
font-size:18px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card{
background:#1c1f26;
padding:15px;
border-radius:10px;
}

.market-name{
font-size:14px;
opacity:.7;
}

.market-price{
font-size:22px;
margin-top:5px;
}

.market-change{
font-size:14px;
margin-top:4px;
}

.up{color:#4cd964}
.down{color:#ff3b30}
</style>
</head>

<body>

<h2>JP Market Weather</h2>

<div id="header"></div>

<div class="cards" id="cards"></div>

<script>

async function load(){

const txt = await fetch("latest_weather.txt?"+Date.now()).then(r=>r.text())

const weather = txt.match(/天気：JP=(.)/)
const score = txt.match(/スコア：([-\d]+)/)
const risk = txt.match(/危険度：(\w+)/)

let header=""

if(weather) header+=`<div class="weather">天気 ${weather[1]}</div>`
if(score) header+=`<div class="score">Score ${score[1]}</div>`
if(risk) header+=`<div class="score">Risk ${risk[1]}</div>`

document.getElementById("header").innerHTML=header

const cards = await fetch("cards.json?"+Date.now()).then(r=>r.json())

let html=""

cards.forEach(c=>{

let cls=""

if(typeof c.change==="number"){
if(c.change>0) cls="up"
if(c.change<0) cls="down"
}

html+=`
<div class="card">
<div class="market-name">${c.name}</div>
<div class="market-price">${c.price}</div>
<div class="market-change ${cls}">${c.change}</div>
</div>
`

})

document.getElementById("cards").innerHTML=html

}

load()

</script>

</body>
</html>
